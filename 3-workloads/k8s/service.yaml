apiVersion: v1
kind: Service
metadata:
  name: hello-world
  labels:
    app: hello-world
  annotations:
    # Container-native load balancing via standalone Network Endpoint Groups (NEG)
    cloud.google.com/neg: '{"ingress": true}'
    # Attach GKE BackendConfig for Cloud Armor WAF integration
    cloud.google.com/backend-config: '{"default": "fast-dev-backend-config"}'
spec:
  type: ClusterIP
  selector:
    app: hello-world
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
