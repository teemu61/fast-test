apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.name | default "db-credentials" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hello-world.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.secretStore.name | default "gcp-secret-store" }}
    kind: SecretStore
  target:
    name: {{ .Values.externalSecret.targetSecretName | default "app-db-secret" }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.externalSecret.secretKey | default "db-password" }}
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
