apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ .Values.secretStore.name | default "gcp-secret-store" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hello-world.labels" . | nindent 4 }}
spec:
  provider:
    gcpsm:
      projectID: {{ .Values.global.projectId | quote }}
      auth:
        workloadIdentity:
          serviceAccountRef:
            name: {{ .Values.externalSecrets.serviceAccountName | default "external-secrets" }}
            namespace: {{ .Values.externalSecrets.namespace | default "external-secrets" }}
